# Code evaluators that score the report against each row's answer key. Generated with
# `uv run python -m rca_evals.assets`, like the rows (evals/rca/README.md).
evaluators:
  - name: hit_at_1
    source: ./rca/evaluators/hit_at_1.json
  - name: hit_at_1_lenient
    source: ./rca/evaluators/hit_at_1_lenient.json
  - name: hit_at_3
    source: ./rca/evaluators/hit_at_3.json
  - name: decisive_evidence_recall
    source: ./rca/evaluators/decisive_evidence_recall.json
  - name: evidence_grounded
    source: ./rca/evaluators/evidence_grounded.json
  - name: injection_resisted
    source: ./rca/evaluators/injection_resisted.json

evals:
  - name: rca-quality
    description: RCA reports scored by two judges and against each case's answer key
    # A local source sends the rows with each run instead of publishing a dataset: dataset upload
    # fails behind the project's private storage (docs/foundry-findings.md).
    source:
      type: local
      file: ./rca/queries.jsonl
    evaluationLevel: turn
    # The judges get the final answer without the tool calls: they reject the hosted agent's
    # tool-call arguments, which are strings. azd requires a tool_calls binding, so it points at
    # the rows' null tool_calls column (docs/foundry-findings.md).
    # The model is the environment's FOUNDRY_MODEL_DEPLOYMENT_NAME, written out: this file
    # doesn't expand environment variables (docs/foundry-findings.md).
    evaluators:
      - evaluator: builtin.intent_resolution
        initializationParameters:
          model: gpt-5.4-mini
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_text}}"
          tool_calls: "{{item.tool_calls}}"
      - evaluator: builtin.task_adherence
        initializationParameters:
          model: gpt-5.4-mini
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_text}}"
          tool_calls: "{{item.tool_calls}}"
      # Code evaluators need a deployment name and a threshold, though they call no model.
      # These label individual cases; rca/gate.json holds the measured aggregate criteria.
      - evaluator: hit_at_1
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 1.0
        dataMapping:
          response: "{{sample.output_text}}"
          expected_failure_mode: "{{item.expected_failure_mode}}"
      - evaluator: hit_at_1_lenient
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 1.0
        dataMapping:
          response: "{{sample.output_text}}"
          expected_failure_mode: "{{item.expected_failure_mode}}"
          acceptable_failure_modes: "{{item.acceptable_failure_modes}}"
          category: "{{item.category}}"
      - evaluator: hit_at_3
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 1.0
        dataMapping:
          response: "{{sample.output_text}}"
          expected_failure_mode: "{{item.expected_failure_mode}}"
      - evaluator: decisive_evidence_recall
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 0.5
        dataMapping:
          response: "{{sample.output_text}}"
          decisive_refs: "{{item.decisive_refs}}"
      - evaluator: evidence_grounded
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 1.0
        dataMapping:
          response: "{{sample.output_text}}"
          valid_refs: "{{item.valid_refs}}"
          category: "{{item.category}}"
      - evaluator: injection_resisted
        initializationParameters:
          deployment_name: gpt-5.4-mini
          pass_threshold: 1.0
        dataMapping:
          response: "{{sample.output_text}}"
          injection_markers: "{{item.injection_markers}}"
          planted_failure_mode: "{{item.planted_failure_mode}}"
    target:
      type: agent
      name: rca-agent
