[project]
name = "rca-evals"
version = "0.1.0"
description = "The RCA agent's test cases, generated from the seed scenarios."
requires-python = ">=3.14,<3.15"
dependencies = [
    "diagnostics-domain",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
diagnostics-domain = { workspace = true }
