[project]
name = "rca-evals"
version = "0.1.0"
description = "Evaluation suite for the RCA agent: case manifest, thresholds and evaluators."
requires-python = ">=3.14,<3.15"
dependencies = [
    "cs-platform",
    "diagnostics-domain",
    "diagnostics-mcp",
    "rca-agent",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
cs-platform = { workspace = true }
diagnostics-domain = { workspace = true }
diagnostics-mcp = { workspace = true }
rca-agent = { workspace = true }
