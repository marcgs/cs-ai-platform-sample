# Minimum mean score per metric over all cases; `csai eval` fails below any of them.
# Baseline 2026-10-28 (gpt-5.4-mini, toolbox, 18 cases): 1.00 on every gated metric except
# tool_coverage 0.97. With the investigation steps removed from the instructions, hit_at_1
# fell to 0.67 and tool_coverage to 0.77, failing the gate.
# Knowledge baseline 2026-10-29, three serialized toolbox suites of 18 cases:
# 16/18, 16/18, 14/18 cited returned, relevant historical cases. A minimum of 0.70
# requires 13/18: one case below the observed worst run, without forcing citations.
# This is a citation regression gate, not a guarantee of search compliance.
minimums:
  schema_valid: 1.0
  hit_at_1: 0.8
  hit_at_3: 0.9
  evidence_grounded: 0.95
  tool_coverage: 0.9
  used_knowledge: 0.7
