evals:
  - name: rca-native-five-normalized-judges
    description: Four judges on normalized retained agent-target outputs; no agent rerun
    evaluationLevel: turn
    source:
      type: local
      file: ${FOUNDRY_NATIVE_NORMALIZED_DATA}
    evaluators:
      - evaluator: builtin.task_adherence
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{item.output_items}}"
          tool_definitions: "{{item.tool_definitions}}"
      - evaluator: builtin.intent_resolution
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{item.response}}"
          tool_definitions: "{{item.tool_definitions}}"
      - evaluator: builtin.coherence
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{item.response}}"
      - evaluator: builtin.tool_call_accuracy
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{item.output_items}}"
          tool_definitions: "{{item.tool_definitions}}"
