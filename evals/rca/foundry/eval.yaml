evals:
  - name: rca-native-smoke-judges
    description: Five existing synthetic cases, hosted responses target, four judges
    evaluationLevel: turn
    source:
      type: local
      file: datasets/smoke.jsonl
    target:
      type: agent
      name: ${AGENT_RCA_AGENT_NAME}
    evaluators:
      - evaluator: builtin.task_adherence
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_items}}"
          tool_definitions: "{{item.tool_definitions}}"
      - evaluator: builtin.intent_resolution
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_text}}"
          tool_definitions: "{{item.tool_definitions}}"
      - evaluator: builtin.coherence
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_text}}"
      - evaluator: builtin.tool_call_accuracy
        initializationParameters:
          model: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_items}}"
          tool_definitions: "{{item.tool_definitions}}"
