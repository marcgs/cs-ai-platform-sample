[project]
name = "rca-agent"
version = "0.1.0"
description = "Root-cause analysis agent for machine incidents, built on the CS AI platform."
requires-python = ">=3.14,<3.15"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry-hosting>=1.0.0b261015",
    "azure-identity>=1.27.0",
    "cs-platform",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
rca-local = "rca_agent.local:main"

[dependency-groups]
dev = ["hatchling>=1.27,<2"]

[tool.uv.sources]
cs-platform = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/rca_agent", "skills"]

[tool.hatch.build.targets.wheel]
packages = ["src/rca_agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "rca_agent/skills"
