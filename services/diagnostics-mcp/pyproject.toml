[project]
name = "diagnostics-mcp"
version = "0.1.0"
description = "Read-only diagnostic tools exposed as an MCP server on Azure Functions."
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-functions>=2.3.0",
    "diagnostics-domain",
    "pydantic>=2.14.1",
]

[tool.uv.sources]
diagnostics-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
