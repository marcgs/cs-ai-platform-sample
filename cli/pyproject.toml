[project]
name = "csai"
version = "0.1.0"
description = "The platform's own commands: read episodes and record expert feedback."
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-core>=1.41.0",
    "azure-identity>=1.27.0",
    "cs-platform",
    "httpx>=0.28.1",
    "platform-api",
    "python-dotenv>=1.1.0",
    "rca-agent",
    "typer>=0.27.3",
]

[project.scripts]
csai = "csai.app:main"

[tool.uv.sources]
cs-platform = { workspace = true }
platform-api = { workspace = true }
rca-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
