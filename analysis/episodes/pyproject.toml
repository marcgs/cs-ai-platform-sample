[project]
name = "episode-analysis"
version = "0.1.0"
description = "Offline-first, source-separated analysis of diagnostic episodes and reviews."
requires-python = ">=3.14,<3.15"
dependencies = [
    "cs-platform",
    "diagnostics-domain",
    "agent-framework-core>=1.22.0",
    "azure-identity>=1.27.0",
    "pydantic>=2.14.1",
]

[project.scripts]
analyze-episodes = "episode_analysis.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
