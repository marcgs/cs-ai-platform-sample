[project]
name = "cs-ai-platform-sample"
version = "0.1.0"
description = "Reference sample: a minimal CS AI platform on Azure, validated with a fictional RCA diagnostics agent."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cs-platform",
    "csai",
    "diagnostics-domain",
    "diagnostics-mcp",
    "platform-api",
    "rca-agent",
    "rca-evals",
    "episode-analysis",
]

[dependency-groups]
dev = [
    # scripts/setup_platform.py (azd hooks)
    "azure-ai-projects>=2.7.0",
    "azure-identity>=1.27.0",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "openai>=3.35.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "agents/*", "evals/*", "analysis/*", "cli"]

[tool.uv.sources]
cs-platform = { workspace = true }
csai = { workspace = true }
diagnostics-domain = { workspace = true }
diagnostics-mcp = { workspace = true }
platform-api = { workspace = true }
rca-agent = { workspace = true }
rca-evals = { workspace = true }
episode-analysis = { workspace = true }

# --- Ruff: lint + format -----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/*/src", "services/*/src", "services/*", "agents/*/src", "evals/*/src", "analysis/*/src", "cli/src", "scripts"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "N",     # naming
  "RUF",   # ruff-specific
  "ASYNC", # async pitfalls
  "PTH",   # prefer pathlib
  "TC",    # type-checking imports
  "PT",    # pytest style
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their imports must stay at module level.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "diagnostics_domain.models._Record"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

# --- Pyright: type checking -------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["packages/*/src", "services/*/src", "agents/*/src", "evals/*/src", "analysis/*/src", "cli/src", "scripts"]
exclude = ["**/.venv", "**/__pycache__", "**/node_modules"]

# --- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["packages", "services", "agents", "evals", "analysis", "cli"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
