[project]
name = "cs-platform"
version = "0.1.0"
description = "Reusable agent platform harness: agent specs, telemetry, episode capture."
requires-python = ">=3.14,<3.15"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-foundry-hosting>=1.0.0b261015",
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.27.0",
    # Agent Framework's MCP client (direct servers and toolboxes); its MCP subscription
    # recovery needs tenacity, which Agent Framework doesn't declare.
    "mcp>=1.24.0,<2",
    "microsoft-opentelemetry>=1.5.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
